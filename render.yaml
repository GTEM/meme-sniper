# Render blueprint for the bot, on the free plan (no payment method needed).
#
# This repository is deliberately thin. Render's free web service gets 0.1 CPU
# and a throwaway disk, and the application bundle it runs is the one the bot's
# own mirror publishes. build.mjs unpacks it; start.sh runs the bot with the
# mirror pusher beside it so the book is backed up off the ephemeral disk.
#
# No values are requested at apply time on purpose: PUBLISH_URL and INGEST_TOKEN
# are added afterwards in the service's Environment tab, which only affects
# mirroring and book backup, not whether the bot runs.
services:
  - type: web
    name: meme-sniper
    runtime: node
    plan: free
    buildCommand: node build.mjs
    startCommand: bash deploy/render/start.sh
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MODE
        value: paper
