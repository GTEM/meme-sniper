# Card-free hosting for the bot on Render (free web service, no payment method).
#
# Point Render at this repository as a Blueprint and it creates the service from
# this file. PUBLISH_URL and INGEST_TOKEN are asked for in the dashboard; without
# them the bot still runs, but nothing is backed up off the throwaway disk.
#
# See deploy/render/README.md.
services:
  - type: web
    name: meme-sniper
    runtime: node
    plan: free
    buildCommand: node build.mjs
    startCommand: bash deploy/render/start.sh
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MODE
        value: paper
      # Testing only: the wallet read follows devnet, so the book stays a test
      # book until the stack is ready for mainnet money.
      - key: PAPER_WALLET_NETWORK
        value: devnet
      - key: PAPER_WALLET_ADDRESS
        sync: false
      - key: PUBLISH_URL
        sync: false
      - key: INGEST_TOKEN
        sync: false
