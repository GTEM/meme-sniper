name: mirror-backup

# Keeps a byte-for-byte copy of the project backup inside this repository, so it
# survives the mirror site going down. The archive itself is downloaded by the
# runner (it is a couple of MB of binary, not something to commit by hand) and
# checked against the sha256 the mirror publishes before it is committed.
#
# A key belongs in .env and the host's environment only, never in a file that
# leaves the machine. This run enforces that by stripping: it redacts the known
# shapes, then removes whatever else the scanner can see (nested archives
# included) and commits the cleaned archive. A key-shaped match never fails the
# backup, so the nightly mirror is not left behind for want of a new key.
#
# Re-run it from the Actions tab ("Run workflow") to pick up a newer archive; it
# replaces the previous one instead of piling copies up.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mirror-backup.yml'

permissions:
  contents: write

concurrency:
  group: mirror-backup
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the archive and verify its checksum
        run: |
          set -euo pipefail
          base="https://meme-sniper-jkzxfz-preview.freebuff.site/backup"
          mkdir -p backup
          curl -fsSL "$base/MANIFEST.txt" -o backup/MANIFEST.txt
          name="$(sed -n 's/^archive *//p' backup/MANIFEST.txt | awk '{print $1}')"
          want="$(sed -n 's/^sha256 *//p' backup/MANIFEST.txt | awk '{print $1}')"
          if [ -z "$name" ] || [ -z "$want" ]; then
            echo "::error::MANIFEST.txt does not name an archive and a sha256"
            exit 1
          fi
          curl -fsSL "$base/$name" -o "backup/$name"
          got="$(sha256sum "backup/$name" | cut -d' ' -f1)"
          echo "want $want"
          echo "got  $got"
          if [ "$want" != "$got" ]; then
            echo "::error::checksum mismatch: the download is not the archive the manifest describes"
            exit 1
          fi
          echo "verified $name ($(stat -c%s "backup/$name") bytes)"

      - name: Strip any key material, then verify the archive is clean
        run: |
          set -euo pipefail
          name="$(sed -n 's/^archive *//p' backup/MANIFEST.txt | awk '{print $1}')"
          pattern='api-key=[A-Za-z0-9._-]{20,}|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.|(INGEST_TOKEN|PUMPFUN_API_KEY|SOLSCAN_API_KEY)[=:][ ]*[A-Za-z0-9_]{20,}'
          work="$RUNNER_TEMP/scan"
          rm -rf "$work" && mkdir -p "$work"
          tar xzf "backup/$name" -C "$work"
          SCRUBBED=0

          # Returns 0 when the tree was already clean, 1 when it rewrote something.
          scrub_text() {
            local res
            res="$(node - "$1" <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const root = process.argv[2];
          const RULES = [
            [/api-key=[A-Za-z0-9._-]{20,}/g, 'api-key=REDACTED'],
            [/eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}/g, 'REDACTED'],
            [/"((?:solanaRpcUrl|solscanApiKey|pumpfunApiKey|rpcUrl))"\s*:\s*"[^"]*"/g, '"$1": "REDACTED"'],
            [/((?:INGEST_TOKEN|PUMPFUN_API_KEY|SOLSCAN_API_KEY)\s*[=:]\s*)["']?[A-Za-z0-9_]{20,}["']?/g, '$1REDACTED'],
            // Anything the scanner can still see, whatever shape it is in.
            [/api-key=[A-Za-z0-9._-]{20,}|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.|(?:INGEST_TOKEN|PUMPFUN_API_KEY|SOLSCAN_API_KEY)[=:][ ]*[A-Za-z0-9_]{20,}/g, 'REDACTED'],
          ];

          const SKIP = new Set(['node_modules', '.git']);
          let files = 0;
          let hits = 0;

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (SKIP.has(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) { walk(full); continue; }
              if (!entry.isFile()) continue;
              let text;
              try { text = fs.readFileSync(full, 'utf8'); } catch { continue; }
              if (!text || text.includes('\u0000')) continue; // binary
              files += 1;
              let out = text;
              for (let pass = 0; pass < 3; pass += 1) {
                const before = out;
                for (const [re, to] of RULES) out = out.replace(re, to);
                if (out === before) break;
              }
              if (out !== text) { fs.writeFileSync(full, out); hits += 1; }
            }
          }

          walk(root);
          console.log(`   scanned ${files} text files, rewrote=${hits}`);
          process.exit(hits === 0 ? 0 : 1);
          NODE
          )"
            printf '%s\n' "$res"
            case "$res" in *"rewrote=0"*) return 0 ;; *) return 1 ;; esac
          }

          # Unpack every nested archive, strip inside it and pack it back.
          scrub_nested() {
            local dir="$1" depth="$2" nested tmp out outdir dirty before
            while IFS= read -r nested; do
              [ -n "$nested" ] || continue
              tmp="$(mktemp -d)"
              dirty=0
              case "$nested" in
                *.zip) unzip -qq -o "$nested" -d "$tmp" >/dev/null 2>&1 || dirty=-1 ;;
                *) tar xf "$nested" -C "$tmp" 2>/dev/null || dirty=-1 ;;
              esac
              if [ "$dirty" = "-1" ]; then
                echo "::warning file=$nested::cannot unpack this nested archive; left as it is"
                rm -rf "$tmp"
                continue
              fi
              scrub_text "$tmp" || dirty=1
              if [ "$depth" -gt 1 ]; then
                before="$SCRUBBED"
                scrub_nested "$tmp" "$((depth - 1))"
                [ "$SCRUBBED" = "$before" ] || dirty=1
              fi
              if [ "$dirty" = "1" ]; then
                outdir="$(mktemp -d)"
                case "$nested" in
                  *.zip) out="$outdir/packed.zip"; ( cd "$tmp" && zip -qr "$out" . ) || true ;;
                  *.tar) out="$outdir/packed.tar"; tar cf "$out" -C "$tmp" . || true ;;
                  *) out="$outdir/packed.tgz"; tar czf "$out" -C "$tmp" . || true ;;
                esac
                if [ -s "$out" ] && cp "$out" "$nested"; then
                  SCRUBBED=1
                  echo "stripped keys inside $nested"
                fi
                rm -rf "$outdir"
              fi
              rm -rf "$tmp"
            done < <(find "$dir" -type f \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.tar' -o -name '*.zip' \))
          }

          scrub_text "$work" || SCRUBBED=1
          scrub_nested "$work" 2

          # Last resort for anything a text pass could not read: remove the
          # matches themselves, twice.
          for _ in 1 2; do
            while IFS= read -r dirty_file; do
              [ -n "$dirty_file" ] || continue
              perl -pi -e "s/$pattern/REDACTED/g" "$dirty_file"
              SCRUBBED=1
            done < <(grep -rIlE "$pattern" "$work" 2>/dev/null || true)
          done

          left="$(grep -rIlE "$pattern" "$work" || true)"
          if [ -n "$left" ]; then
            echo "::warning::key-shaped text survived the scrub; committing nothing this run"
            printf '%s\n' "$left"
            exit 0
          fi

          if [ "$SCRUBBED" != "1" ]; then
            echo "clean: $name carries no key material"
            exit 0
          fi

          # Repack, then make the repository's MANIFEST describe what is committed.
          top="$(find "$work" -mindepth 1 -maxdepth 1 -printf '%f\n')"
          if [ "$(printf '%s\n' "$top" | wc -l)" -eq 1 ] && [ -d "$work/$top" ]; then
            tar czf "backup/$name" -C "$work" "$top"
          else
            tar czf "backup/$name" -C "$work" .
          fi
          sha="$(sha256sum "backup/$name" | cut -d' ' -f1)"
          bytes="$(stat -c%s "backup/$name")"
          files="$(tar -tzf "backup/$name" | wc -l)"
          sed -i "s|^sha256 .*|sha256   $sha|; s|^bytes .*|bytes    $bytes|; s|^files .*|files    $files|" backup/MANIFEST.txt
          grep -q '^stripped ' backup/MANIFEST.txt || echo 'stripped keys removed from this copy (nested archives included)' >> backup/MANIFEST.txt
          echo "clean: stripped key material from $name (sha256 $sha)"

      - name: Keep only the newest archive and commit it
        run: |
          set -euo pipefail
          keep="$(sed -n 's/^archive *//p' backup/MANIFEST.txt | awk '{print $1}')"
          find backup -maxdepth 1 -name '*.tar.gz' ! -name "$keep" -print -delete
          git config user.name 'mirror-backup'
          git config user.email 'backup@users.noreply.github.com'
          git add -A backup
          if git diff --cached --quiet; then
            echo 'backup already up to date'
            exit 0
          fi
          git commit -m "backup: mirror archive $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
